<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-back Task</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
        }

        .nback-stim {
            font-size: 80px;
            font-weight: bold;
        }

        .nback-img {
            width: 300px;
            height: 300px;
            object-fit: contain;
        }

        .btn-download {
            background-color: #6366f1;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <script>
        const jsPsych = initJsPsych({
            on_finish: function () {
                document.body.innerHTML = '<div style="text-align:center; margin-top: 20%;">' +
                    '<h1>Task Complete!</h1>' +
                    '<p>Your results have been saved.</p>' +
                    '<button class="btn-download" onclick="location.reload()">Restart Task</button>' +
                    '<br><br><a href="index.html" style="color:#6366f1;">Back to Menu</a>' +
                    '</div>';
            }
        });

        const subject_id = jsPsych.randomization.randomID(10);
        const filename = `nback_${subject_id}.csv`;
        jsPsych.data.addProperties({ subject_id: subject_id });

        const name_entry = {
            type: jsPsychSurveyText,
            questions: [{ prompt: "Please enter your name:", name: 'participant_name', required: true }],
            on_finish: function (data) {
                jsPsych.data.addProperties({ participant_name: data.response.participant_name });
            }
        };

        let n = 1;
        let stim_type = 'letters';
        const n_trials = 30;
        const n_targets = 12;
        const max_targets_in_a_row = 3;
        const max_appearances = 4; // targets can copy targets, so cap how often one stimulus recurs
        // Every non-target is a stimulus never shown before, so each run needs one per non-target
        const pool_size = n_trials - n_targets;
        const letters = 'BCDFGHJKLMNPQRSTVWXYZ'.split(''); // consonants only
        const n_images = 61; // _stimuli/faces and _stimuli/scenes contain 0.jpg ... 60.jpg
        let stim_pool = jsPsych.randomization.sampleWithoutReplacement(letters, pool_size);

        const setup = {
            type: jsPsychSurveyHtmlForm,
            html: `
                <div style="text-align:left;">
                <h2>N-back Task Setup</h2>
                <p>Select the level of N:</p>
                <div style="margin: 20px 0;">
                    <label><input type="radio" name="n_val" value="1" checked> 1-back</label><br>
                    <label><input type="radio" name="n_val" value="2"> 2-back</label><br>
                    <label><input type="radio" name="n_val" value="3"> 3-back</label>
                </div>
                <p>Select the stimulus type:</p>
                <div style="margin: 20px 0;">
                    <label><input type="radio" name="stim_type" value="letters" checked> Letters</label><br>
                    <label><input type="radio" name="stim_type" value="faces"> Faces</label><br>
                    <label><input type="radio" name="stim_type" value="scenes"> Scenes</label>
                </div>
                </div>
            `,
            button_label: 'Continue',
            on_finish: function (data) {
                n = parseInt(data.response.n_val);
                stim_type = data.response.stim_type;
                const all_stimuli = stim_type === 'letters'
                    ? letters
                    : Array.from({ length: n_images }, (_, i) => `_stimuli/${stim_type}/${i}.jpg`);
                stim_pool = jsPsych.randomization.sampleWithoutReplacement(all_stimuli, pool_size);
                jsPsych.data.addProperties({ n: n, stimulus_type: stim_type });
                generateTrials(n);
            }
        };

        const preload = {
            type: jsPsychPreload,
            images: () => stim_type === 'letters' ? [] : stim_pool
        };

        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function () {
                return `
                    <div style="text-align:left;">
                    <h1>Instructions (${n}-back)</h1>
                    <p>You will see a series of ${stim_type}.</p>
                    <p>Press <strong>SPACE</strong> whenever the current ${stim_type.slice(0, -1)} matches the one shown <strong>${n}</strong> position(s) ago.</p>
                    <p>Otherwise, press nothing.</p>
                    <p>Press any key to start.</p>
                    </div>
                `;
            }
        };

        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="font-size: 60px;">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500,
        };

        // Sequence generation. The trials array is filled in place once N and the stimulus type
        // are chosen in setup, since the timeline captures this array before setup runs.
        const trials = Array.from({ length: n_trials }, () => ({}));

        function generateTrials(n) {
            // Choose exactly n_targets positions from those that can be targets (index >= n).
            // Targets repeat the item from n back; every non-target is the next unused stimulus.
            // Resample until no more than max_targets_in_a_row targets occur consecutively and
            // no stimulus appears more than max_appearances times.
            const eligible = Array.from({ length: n_trials - n }, (_, i) => i + n);
            let target_positions, sequence;
            do {
                target_positions = new Set(jsPsych.randomization.sampleWithoutReplacement(eligible, n_targets));
                sequence = [];
                let next_novel = 0;
                for (let i = 0; i < n_trials; i++) {
                    sequence.push(target_positions.has(i) ? sequence[i - n] : stim_pool[next_novel++]);
                }
            } while (longestTargetRun(target_positions) > max_targets_in_a_row ||
                     maxAppearances(sequence) > max_appearances);
            sequence.forEach((item, index) => {
                trials[index].stimulus = stim_type === 'letters'
                    ? `<div class="nback-stim">${item}</div>`
                    : `<img src="${item}" class="nback-img">`;
                trials[index].data = {
                    task: 'nback',
                    item: item,
                    trial_index: index,
                    is_target: index >= n && item === sequence[index - n]
                };
            });
        }
        generateTrials(n);

        function maxAppearances(sequence) {
            const counts = {};
            sequence.forEach(item => counts[item] = (counts[item] || 0) + 1);
            return Math.max(...Object.values(counts));
        }

        function longestTargetRun(target_positions) {
            let longest = 0, run = 0;
            for (let i = 0; i < n_trials; i++) {
                run = target_positions.has(i) ? run + 1 : 0;
                longest = Math.max(longest, run);
            }
            return longest;
        }

        const test = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: jsPsych.timelineVariable('stimulus'),
            choices: [' '],
            trial_duration: 1000,
            response_ends_trial: false,
            data: jsPsych.timelineVariable('data'),
            on_finish: function (data) {
                data.response_pressed = data.response === ' ';
                data.correct = data.response_pressed === data.is_target;
                data.rt = data.rt ? data.rt / 1000 : null;
            }
        };

        const test_procedure = {
            timeline: [fixation, test],
            timeline_variables: trials,
            randomize_order: false
        };

        const save_data = {
            type: jsPsychPipe,
            action: "save",
            experiment_id: "pBNXrMsbp1xO",
            filename: filename,
            data_string: () => jsPsych.data.get().csv()
        };

        const summary_screen = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function () {
                const trials = jsPsych.data.get().filter({ task: 'nback' });
                const accuracy = trials.filter({ correct: true }).count() / trials.count() * 100;
                const rt_trials = trials.filter({ response_pressed: true });
                const mean_rt = rt_trials.select('rt').mean();

                return `
                    <div style="text-align:left; font-size: 20px; line-height: 1.6;">
                        <h1>Task Summary</h1>
                        <p><strong>Accuracy:</strong> ${accuracy.toFixed(1)}%</p>
                        <p><strong>Mean Response Time:</strong> ${mean_rt ? mean_rt.toFixed(3) + ' s' : 'N/A'}</p>
                        <br>
                        <p>Press <strong>SPACE</strong> to finish the experiment.</p>
                    </div>
                `;
            },
            choices: [' ']
        };

        jsPsych.run([name_entry, setup, preload, instructions, test_procedure, save_data, summary_screen]);
    </script>
</body>

</html>
